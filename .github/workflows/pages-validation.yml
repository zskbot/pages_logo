name: Pages build validation

on:
  pull_request:
    paths:
      - "_config.yml"
      - "index.html"
      - "OCode.js/**"
      - "assets/**"
      - ".github/workflows/pages-validation.yml"
      - "content/**"
      - "files/**"

permissions:
  contents: read

concurrency:
  group: pages-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build Jekyll site without deploying
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/srv/jekyll" \
            -w /srv/jekyll \
            jekyll/builder:latest \
            jekyll build --source /srv/jekyll --destination /tmp/site
